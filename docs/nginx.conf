##############################################################
# Blockchain Tamper-Proof System — Production Nginx Config
# Server: 32.196.165.92
# Stack: React/Vite frontend + FastAPI backend (port 8000)
# Place at: /etc/nginx/sites-available/blockchain
##############################################################

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;

    # Update to your domain when available:
    # server_name yourdomain.com www.yourdomain.com;
    server_name 32.196.165.92 _;

    # ── Security Headers ───────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Logging ────────────────────────────────────────────────
    access_log /var/log/nginx/blockchain_access.log;
    error_log  /var/log/nginx/blockchain_error.log warn;

    # ── Gzip Compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript
        application/xml+rss application/atom+xml
        image/svg+xml;

    # ── Frontend — React/Vite SPA ──────────────────────────────
    root /var/www/blockchain/frontend/dist;
    index index.html;

    # Misc settings
    server_tokens off;
    client_max_body_size 50M;

    # ── SPA Routing (handles /login, /dashboard, /chain, etc.) ─
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Backend API Proxy ──────────────────────────────────────
    # All /api/* requests proxy to FastAPI on localhost:8000
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings
        proxy_buffering         on;
        proxy_buffer_size       4k;
        proxy_buffers           8 4k;
        proxy_busy_buffers_size 8k;

        # WebSocket support (for future real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── FastAPI Swagger UI (disable in production if desired) ──
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Error pages ────────────────────────────────────────────
    error_page 404             /index.html;
    error_page 500 502 503 504 /index.html;
}

